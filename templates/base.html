<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cassiopeia{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    {% block extra_head %}{% endblock %}
</head>

<body>
    <div class="app-wrapper">
        <header class="app-header">
            <span class="app-header-title">Cassiopeia</span>
            <button class="app-header-settings" aria-label="Settings" onclick="showToast('Settings coming soon')">
                <i class="fa-solid fa-gear"></i>
            </button>
        </header>
        {% block content %}
        <!-- Сюди підставляється вміст index.html -->
        {% endblock %}
    </div>

    <!-- Тост для заглушок (Тиждень/Місяць/Рік) -->
    <div id="toast" class="toast"></div>

    <!-- Банер сповіщення "час завдання настав" -->
    <div id="notification-banner" class="notification-banner"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', path='js/app.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
